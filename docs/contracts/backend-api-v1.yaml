openapi: 3.1.0
info:
  title: YNS API
  version: 1.0.0
  description: Canonical contract for the YNS public website and authenticated CMS.
x-yns-contract-revision: content-2
tags:
  - name: Content
    description: Private drafts and explicitly published website content.
  - name: Authentication
    description: CMS browser authentication and account activation.
  - name: Administration
    description: Superadmin-only team access management.
  - name: Dashboard
    description: Role-aware dashboard data for active CMS accounts.
servers:
  - url: "{origin}"
    variables:
      origin:
        default: http://localhost:8000
        description: Environment-configured backend origin.
security:
  - cookieAuth: []
paths:
  /api/v1/admin/content:
    get:
      operationId: listContentDrafts
      summary: Load saved editorial items
      description: Both active CMS roles may read saved drafts. Preview fixtures are not automatically saved.
      tags:
        - Content
      responses:
        '200':
          description: Saved items and versions
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedContent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ContentUnavailable'
  /api/v1/admin/content/{module}/{record}:
    parameters:
      - in: path
        name: module
        required: true
        schema:
          $ref: '#/components/schemas/ContentModule'
      - in: path
        name: record
        required: true
        description: Stable item key; singletons require current.
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,100}$
    put:
      operationId: saveContent
      summary: Save a draft or publish the selected item
      tags:
        - Content
      description: >-
        Both active CMS roles may save and publish. Version 0 creates; subsequent writes require the returned version. Draft saves preserve
        the published snapshot. Publish exposes submitted values. Module fields are allowlisted. Publishing requires heading/title/name,
        location area, and event startsAt. Leadership accepts name, role, description, imageSrc, and imageAlt;
        role and portrait fields are optional for existing profiles. A supplied portrait requires an HTTPS URL without credentials
        and nonblank imageAlt. Links/media must be safe. No file uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - version
                - values
              properties:
                action:
                  type: string
                  enum:
                    - draft
                    - publish
                version:
                  type: integer
                  minimum: 0
                  maximum: 2147483646
                values:
                  $ref: '#/components/schemas/ContentValues'
      responses:
        '200':
          description: Saved item and new version
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/SavedContent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Stale version; preserve edits and reload saved content.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - code
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    const: content_conflict
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ContentUnavailable'
  /api/v1/public/content:
    get:
      operationId: listPublishedContent
      summary: Read published website content
      description: Only explicit published snapshots. Drafts and private metadata are excluded. Empty data is valid; no fixture fallback.
      tags:
        - Content
      security: []
      responses:
        '200':
          description: Published items; no-store caching
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublishedContent'
        '503':
          $ref: '#/components/responses/ContentUnavailable'
  /api/v1/admin/dashboard:
    get:
      operationId: getDashboard
      summary: Get the current CMS dashboard
      description: Return real team aggregates to Superadmin and no team data to Admin. Unimplemented editorial sections and counts are null with explicit section errors; they are never fabricated empty datasets.
      tags: [Dashboard]
      responses:
        "200":
          description: Role-aware dashboard snapshot, possibly with unavailable sections
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DashboardSnapshot" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Dashboard data could not be read
          content:
            application/json:
              schema:
                type: object
                required: [message, code]
                properties:
                  message: { type: string }
                  code: { type: string, const: dashboard_unavailable }
  /sanctum/csrf-cookie:
    post:
      operationId: initializeCsrf
      summary: Initialize CSRF protection for the browser session
      description: Initialize CSRF protection for the browser session.
      tags: [Authentication]
      security: []
      responses:
        "204": { description: CSRF cookie initialized }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create a CMS browser session
      description: Create a CMS browser session.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: Too many attempts }
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: Restore the authenticated CMS session
      description: Restore the authenticated CMS session.
      tags: [Authentication]
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Destroy the current CMS session
      description: Destroy the current CMS session.
      tags: [Authentication]
      responses:
        "204": { description: Session destroyed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a password reset without revealing account existence
      description: Request a password reset without revealing account existence.
      tags: [Authentication]
      security: []
      requestBody: { $ref: "#/components/requestBodies/Email" }
      responses:
        "202": { description: Request accepted }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/MailUnavailable" }
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset a password and revoke all existing sessions
      description: Reset a password and revoke all existing sessions.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200": { description: Password reset }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/auth/invitations/inspect:
    post:
      operationId: inspectInvitation
      summary: Inspect an invitation token
      description: Inspect an invitation token.
      tags: [Authentication]
      security: []
      requestBody: { $ref: "#/components/requestBodies/Token" }
      responses:
        "200": { description: Invitation details }
        "404": { description: "Invitation invalid, used, or revoked" }
        "410": { description: Invitation expired }
  /api/v1/auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Create an admin account from an invitation
      description: Create an admin account from an invitation.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInvitationRequest" }
      responses:
        "201": { $ref: "#/components/responses/UserResponse" }
        "404": { description: "Invitation invalid, used, or revoked" }
        "410": { description: Invitation expired }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List CMS users
      description: List CMS users.
      tags: [Administration]
      responses:
        "200": { description: User list }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/users/{user}/status:
    patch:
      operationId: updateUserStatus
      summary: Disable or reactivate a CMS user
      description: Disable or reactivate a CMS user.
      tags: [Administration]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [active], properties: { active: { type: boolean } } }
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/admin/invitations:
    get:
      operationId: listInvitations
      summary: List admin invitations
      description: List admin invitations.
      tags: [Administration]
      responses:
        "200": { description: Invitation list }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: inviteAdmin
      summary: Invite an admin
      description: Invite an admin.
      tags: [Administration]
      requestBody: { $ref: "#/components/requestBodies/Email" }
      responses:
        "201": { description: Invitation sent }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/MailUnavailable" }
  /api/v1/admin/invitations/{invitation}/resend:
    post:
      operationId: resendInvitation
      summary: Replace and resend an invitation token
      description: Replace and resend an invitation token.
      tags: [Administration]
      parameters: [{ $ref: "#/components/parameters/InvitationId" }]
      responses:
        "200": { description: Invitation resent }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/MailUnavailable" }
  /api/v1/admin/invitations/{invitation}:
    delete:
      operationId: revokeInvitation
      summary: Revoke a CMS user invitation
      description: Revoke a CMS user invitation.
      tags: [Administration]
      parameters: [{ $ref: "#/components/parameters/InvitationId" }]
      responses:
        "204": { description: Invitation revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: laravel_session }
  parameters:
    UserId: { name: user, in: path, required: true, schema: { type: integer } }
    InvitationId: { name: invitation, in: path, required: true, schema: { type: integer } }
  requestBodies:
    Email:
      required: true
      content:
        application/json:
          schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
    Token:
      required: true
      content:
        application/json:
          schema: { type: object, required: [token], properties: { token: { type: string } } }
  responses:
    ContentUnavailable:
      description: Content storage is unavailable; no write is confirmed as saved.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
              - code
            properties:
              message:
                type: string
              code:
                type: string
                const: content_unavailable
    UserResponse:
      description: Safe CMS user
      content:
        application/json:
          schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/User" } } }
    Unauthenticated: { description: Authentication required }
    Forbidden: { description: Account disabled or insufficient permission }
    MailUnavailable: { description: Email delivery unavailable }
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LaravelValidationError" }
  schemas:
    ContentModule:
      type: string
      enum:
        - hero
        - about
        - gathering
        - contact
        - story
        - leader
        - location
        - album
        - event
    ContentValues:
      type: object
      description: >-
        Module-specific string fields matching the editor. Unknown fields are rejected. Photos are a JSON-encoded array of at most 100 objects
        with src, alt, title, size. Event dates use YYYY-MM-DDTHH:mm in Asia/Manila.
        The leader module allows name, role, description, imageSrc, imageAlt only. Publishing requires name;
        role and portraits are optional. Nonempty imageSrc must be an HTTPS URL without credentials and requires nonblank imageAlt.
      maxProperties: 40
      properties:
        name:
          type: string
          maxLength: 100000
          description: Leadership officer name; required when publishing a leader.
        role:
          type: string
          maxLength: 100000
          description: Optional official leadership role.
        description:
          type: string
          maxLength: 100000
          description: Short introduction for leadership profiles, or descriptive text for other modules.
        imageSrc:
          type: string
          maxLength: 2048
          description: Optional HTTPS portrait or location photo URL without credentials; an empty string clears the photo.
        imageAlt:
          type: string
          maxLength: 100000
          description: Photo description; must be nonblank whenever imageSrc is nonempty.
      additionalProperties:
        type: string
        maxLength: 100000
    PublishedContent:
      type: object
      additionalProperties: false
      required:
        - moduleId
        - recordId
        - values
      properties:
        moduleId:
          $ref: '#/components/schemas/ContentModule'
        recordId:
          type: string
          maxLength: 100
        values:
          $ref: '#/components/schemas/ContentValues'
    SavedContent:
      type: object
      additionalProperties: false
      required:
        - moduleId
        - recordId
        - values
        - version
        - publishedAt
        - hasUnpublishedChanges
      properties:
        moduleId:
          $ref: '#/components/schemas/ContentModule'
        recordId:
          type: string
          maxLength: 100
        values:
          $ref: '#/components/schemas/ContentValues'
        version:
          type: integer
          minimum: 1
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        hasUnpublishedChanges:
          type: boolean
    User:
      type: object
      additionalProperties: false
      required: [id, name, email, role, active]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [superadmin, admin] }
        active: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    ResetPasswordRequest:
      type: object
      required: [email, token, password, password_confirmation]
      properties:
        email: { type: string, format: email }
        token: { type: string }
        password: { type: string, format: password, minLength: 12 }
        password_confirmation: { type: string, format: password }
    AcceptInvitationRequest:
      type: object
      required: [token, name, password, password_confirmation]
      properties:
        token: { type: string }
        name: { type: string, maxLength: 255 }
        password: { type: string, format: password, minLength: 12 }
        password_confirmation: { type: string, format: password }
    LaravelValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    DashboardPerson:
      type: object
      additionalProperties: false
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [superadmin, admin] }
    DashboardContent:
      type: object
      additionalProperties: false
      required: [id, title, kind, status, author, updated_at, summary]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [story, event, page, album] }
        status: { type: string, enum: [published, draft, scheduled] }
        author:
          anyOf:
            - { $ref: "#/components/schemas/DashboardPerson" }
            - { type: "null" }
        updated_at: { type: string, format: date-time }
        summary: { type: string }
    DashboardEvent:
      type: object
      additionalProperties: false
      required: [id, title, starts_at, location]
      properties:
        id: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        location: { type: [string, "null"] }
    DashboardUpdate:
      type: object
      additionalProperties: false
      required: [id, person, action, title, occurred_at]
      properties:
        id: { type: string }
        person:
          anyOf:
            - { $ref: "#/components/schemas/DashboardPerson" }
            - { type: "null" }
        action: { type: string }
        title: { type: string }
        occurred_at: { type: string, format: date-time }
    DashboardActivityDay:
      type: object
      additionalProperties: false
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer, minimum: 0 }
    DashboardSnapshot:
      type: object
      additionalProperties: false
      required: [as_of, timezone, summary, content, events, updates, activity, team, unavailable]
      properties:
        as_of: { type: string, format: date-time }
        timezone: { type: string, const: Asia/Manila }
        summary:
          type: object
          additionalProperties: false
          required: [published, drafts, upcoming_events, active_members, pending_invitations]
          properties:
            published: { type: [integer, "null"], minimum: 0 }
            drafts: { type: [integer, "null"], minimum: 0 }
            upcoming_events: { type: [integer, "null"], minimum: 0 }
            active_members: { type: [integer, "null"], minimum: 0 }
            pending_invitations: { type: [integer, "null"], minimum: 0 }
        content:
          type: [array, "null"]
          maxItems: 6
          items: { $ref: "#/components/schemas/DashboardContent" }
        events:
          type: [array, "null"]
          maxItems: 3
          items: { $ref: "#/components/schemas/DashboardEvent" }
        updates:
          type: [array, "null"]
          maxItems: 3
          items: { $ref: "#/components/schemas/DashboardUpdate" }
        team:
          type: [array, "null"]
          maxItems: 3
          items: { $ref: "#/components/schemas/DashboardPerson" }
        activity:
          type: [object, "null"]
          additionalProperties: false
          required: [last_7_days, previous_7_days]
          properties:
            last_7_days:
              type: array
              minItems: 7
              maxItems: 7
              items: { $ref: "#/components/schemas/DashboardActivityDay" }
            previous_7_days:
              type: array
              minItems: 7
              maxItems: 7
              items: { $ref: "#/components/schemas/DashboardActivityDay" }
        unavailable:
          type: object
          additionalProperties: false
          required: [content, events, updates, activity]
          properties:
            content: { type: [string, "null"] }
            events: { type: [string, "null"] }
            updates: { type: [string, "null"] }
            activity: { type: [string, "null"] }
