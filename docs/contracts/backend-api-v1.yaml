openapi: 3.1.0
info:
  title: YNS API
  version: 1.0.0
  description: >-
    Canonical contract for the YNS public website and authenticated CMS.
    Paths are added only through approved feature records; an empty paths object
    means that no product API endpoint has been approved yet.
x-yns-contract-revision: readiness-1
servers:
  - url: "{origin}/api/v1"
    variables:
      origin:
        default: http://localhost:8000
        description: Environment-configured backend origin; never hard-code production origins.
paths: {}
components:
  schemas:
    LaravelValidationError:
      type: object
      additionalProperties: false
      required:
        - message
        - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

